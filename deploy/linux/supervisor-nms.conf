; ==============================================================================
; SUPERVISOR CONFIGURATION — NMS OLT ZTE (ZETSET)
; Lokasi simpan di Ubuntu/Debian : /etc/supervisor/conf.d/supervisor-nms.conf
;
; CATATAN PATH & USER:
; - Untuk Apache Standar Ubuntu : directory=/var/www/NMSZetset, user=www-data, php=/usr/bin/php
; - Untuk XAMPP / LAMPP         : directory=/opt/lampp/htdocs/NMSZetset, user=daemon, php=/opt/lampp/bin/php
; ==============================================================================

[program:nms-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/NMSZetset/artisan queue:work olt --queue=olt,default --sleep=1 --tries=1 --timeout=330
directory=/var/www/NMSZetset
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/NMSZetset/storage/logs/supervisor-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=360
environment=MIBS=":"

[program:nms-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/NMSZetset/artisan schedule:work
directory=/var/www/NMSZetset
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/NMSZetset/storage/logs/supervisor-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
environment=MIBS=":"

[program:nms-monitor]
process_name=%(program_name)s
command=/usr/bin/php /var/www/NMSZetset/artisan nms:monitor
directory=/var/www/NMSZetset
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/NMSZetset/storage/logs/supervisor-monitor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
environment=MIBS=":"

; Opsional: Aktifkan autostart=true setelah melakukan scan QR Baileys pertama kali
[program:nms-wa-baileys]
process_name=%(program_name)s
command=/usr/bin/node /var/www/NMSZetset/scripts/baileys-gateway.mjs
directory=/var/www/NMSZetset
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/NMSZetset/storage/logs/supervisor-baileys.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
environment=NODE_ENV="production",WA_HOST="127.0.0.1",WA_PORT="3001"
