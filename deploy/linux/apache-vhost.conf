# ==============================================================================
# APACHE VIRTUALHOST CONFIGURATION — NMS OLT ZTE (ZETSET)
#
# OPSI A — Ubuntu / Debian Apache Standar:
#   Salin ke : /etc/apache2/sites-available/nms-zetset.conf
#   Aktifkan : sudo a2enmod rewrite headers && sudo a2ensite nms-zetset.conf && sudo systemctl reload apache2
#
# OPSI B — XAMPP / LAMPP (/opt/lampp):
#   Tambahkan blok VirtualHost ke : /opt/lampp/etc/extra/httpd-vhosts.conf
#   Pastikan baris `Include etc/extra/httpd-vhosts.conf` di `/opt/lampp/etc/httpd.conf` tidak dikomentari (#)
#   Lalu restart : sudo /opt/lampp/lampp restart
# ==============================================================================

<VirtualHost *:80>
    ServerName nms.local
    # Ganti ServerAlias dengan IP Server Kantor Anda jika diakses langsung via IP
    ServerAlias 127.0.0.1

    # --- PILIH SALAH SATU SESUAI LINGKUNGAN SERVER ---
    # 1) Path Apache Standar Ubuntu/Debian:
    DocumentRoot /var/www/NMSZetset/public

    # 2) Path XAMPP / LAMPP (hapus tanda # jika menggunakan /opt/lampp):
    # DocumentRoot /opt/lampp/htdocs/NMSZetset/public

    <Directory /var/www/NMSZetset/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Buka komentar blok di bawah ini jika menggunakan XAMPP / LAMPP (/opt/lampp):
    # <Directory /opt/lampp/htdocs/NMSZetset/public>
    #     Options -Indexes +FollowSymLinks
    #     AllowOverride All
    #     Require all granted
    # </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/nms-error.log
    CustomLog ${APACHE_LOG_DIR}/nms-access.log combined
</VirtualHost>
