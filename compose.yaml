services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nms
      POSTGRES_USER: nms
      POSTGRES_PASSWORD: ${NMS_DB_PASSWORD:?Set NMS_DB_PASSWORD before starting Postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d nms"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nms_redis:/data
volumes:
  nms_postgres:
  nms_redis:
