<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lumina-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="lumina-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="lumina-beam-v" x1="20" y1="14" x2="20" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="lumina-beam-h" x1="16" y1="44" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lumina-ray" x1="22" y1="42" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="lumina-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Obsidian Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lumina-bg)" stroke="url(#lumina-border)" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="url(#lumina-glow)"/>

  <!-- Optical PON Splitter Rays (1:3 Fiber Fan-out) -->
  <path d="M21 43 L44 20" stroke="url(#lumina-ray)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M21 43 L47 31" stroke="url(#lumina-ray)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M21 43 L33 17" stroke="url(#lumina-ray)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Geometric 'L' Fiber Core -->
  <rect x="16" y="14" width="7.5" height="33.5" rx="3.75" fill="url(#lumina-beam-v)"/>
  <rect x="16" y="40" width="32" height="7.5" rx="3.75" fill="url(#lumina-beam-h)"/>

  <!-- Photon Optical Nodes -->
  <circle cx="45.5" cy="18.5" r="3.6" fill="#6ee7b7"/>
  <circle cx="45.5" cy="18.5" r="6" fill="#34d399" opacity="0.25"/>
  <circle cx="48" cy="30.5" r="2.8" fill="#38bdf8"/>
  <circle cx="33.5" cy="16" r="2.8" fill="#38bdf8"/>

  <!-- Core Prism Vertex -->
  <circle cx="19.75" cy="43.75" r="3.2" fill="#ecfdf5"/>
</svg>
